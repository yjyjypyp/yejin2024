<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ye Jin Choi — Selected Works 2026</title>
  <!-- Hidden page: not linked from the site, kept out of search results -->
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { --bg: #e8e8e8; --ink: #111; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .frame {
      position: fixed;
      inset: 0;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .fullscreen {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 2;
      font-size: 13px;
      line-height: 1;
      color: var(--ink);
      text-decoration: none;
      background: rgba(255,255,255,0.85);
      padding: 8px 10px;
      border-radius: 999px;
      transition: opacity 0.2s ease;
    }
    .fullscreen:hover { opacity: 0.5; }
  </style>
</head>
<body>
  <a class="fullscreen" id="fullscreen" href="#" target="_blank" rel="noopener">View full screen ↗</a>
  <div class="frame">
    <iframe id="portfolio" title="Ye Jin Choi — Selected Works 2026" allowfullscreen></iframe>
  </div>

  <script>
    // Selected (default) prototype — always opens on the Cover (flow starting point 561:1198)
    const PROTOTYPE_URL = "https://www.figma.com/proto/nqnpU3lAefer397qDE1Gru/Portfolio-2026-%E2%80%94-Ye-Jin-Choi?node-id=561-1198&p=f&scaling=min-zoom&content-scaling=fixed&starting-point-node-id=561%3A1198&page-id=561%3A1197";

    const embed = new URL(PROTOTYPE_URL.replace("https://www.figma.com/", "https://embed.figma.com/"));
    embed.searchParams.set("embed-host", "share");
    embed.searchParams.set("hide-ui", "1");

    document.getElementById("portfolio").src = embed.toString();
    document.getElementById("fullscreen").href = PROTOTYPE_URL;
  </script>
</body>
</html>
